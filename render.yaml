services:
  - type: web
    name: inkloom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.6}
      - {key: MONGODB_URI, sync: false}
      - {key: MONGODB_DB, value: inkloom}
      - {key: JWT_SECRET, generateValue: true}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: GEMINI_MODEL, value: gemini-2.5-flash}
      - {key: CORS_ORIGINS, sync: false}
      - {key: DEMO_MODE, value: "false"}